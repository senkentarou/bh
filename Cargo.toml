[package]
name = "bh"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
